<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>부산 공영주차장</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1565c0">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>

  <div class="container">

    <h1>부산 공영주차장</h1>

    <p class="subtitle">
      실시간 주차가능 정보와 기본정보를 함께 조회합니다.
    </p>


    <!-- 검색 영역 -->
    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="주차장 이름을 입력하세요. 예: 화명"
      >

      <button id="searchButton">
        검색
      </button>

    </div>



    <!-- PWA 설치 안내 -->
    <div class="install-box">
      <button id="installButton" class="install-button" hidden>
        앱처럼 설치하기
      </button>

      <span class="install-guide">
        휴대폰 홈 화면에 추가하면 앱처럼 사용할 수 있습니다.
      </span>
    </div>

    <!-- 검색 결과 안내 -->
    <div id="summary"></div>


    <!-- 정렬 / 새로고침 영역 -->
    <div class="control-box">

      <div class="sort-box">

        <button
          id="defaultSortButton"
          class="sort-button active"
        >
          기본순
        </button>

        <button
          id="availableSortButton"
          class="sort-button"
        >
          빈자리 많은 순
        </button>

      </div>


      <button
        id="refreshButton"
        class="refresh-button"
      >
        ↻ 최신정보 새로고침
      </button>

    </div>


    <!-- 검색 결과 -->
    <div id="result"></div>

  </div>


  <script src="app.js"></script>

  <script>
    let deferredInstallPrompt = null;

    const installButton =
      document.getElementById("installButton");


    window.addEventListener(
      "beforeinstallprompt",
      (event) => {

        event.preventDefault();

        deferredInstallPrompt =
          event;

        installButton.hidden =
          false;

      }
    );


    installButton.addEventListener(
      "click",
      async () => {

        if (!deferredInstallPrompt) {
          return;
        }

        deferredInstallPrompt.prompt();

        await deferredInstallPrompt.userChoice;

        deferredInstallPrompt =
          null;

        installButton.hidden =
          true;

      }
    );


    window.addEventListener(
      "appinstalled",
      () => {

        deferredInstallPrompt =
          null;

        installButton.hidden =
          true;

      }
    );


    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "./service-worker.js"
          );

        }
      );

    }
  </script>

</body>
</html>
